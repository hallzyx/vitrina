<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vitrina</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf7f2; color: #2b2622; }
      main { text-align: center; padding: 16px; max-width: 32rem; }
      button { font: inherit; margin-top: 1rem; padding: .4rem .9rem; border-radius: 999px; border: 1px solid #2b2622; background: transparent; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Vitrina</h1>
      <p data-i18n="tagline"></p>
      <p><small data-i18n="soon"></small></p>
      <button id="lang-toggle" type="button"></button>
    </main>
    <script>
      // Placeholder i18n; the real app moves these strings to frontend/src/i18n/{en,es}.json
      var STRINGS = {
        en: {
          tagline: "Upload photos of your craft and get a store where your customers can spin it and see it in detail.",
          soon: "Coming soon.",
          toggle: "Español"
        },
        es: {
          tagline: "Sube fotos de tu artesanía y obtén una tienda donde tus clientes pueden girarla y verla en detalle.",
          soon: "Próximamente.",
          toggle: "English"
        }
      };

      function detectLang() {
        try {
          var saved = localStorage.getItem("lang");
          if (saved === "en" || saved === "es") return saved;
        } catch (e) {}
        var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
        return String(langs[0]).toLowerCase().indexOf("es") === 0 ? "es" : "en";
      }

      function apply(lang) {
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          el.textContent = STRINGS[lang][el.getAttribute("data-i18n")];
        });
        document.getElementById("lang-toggle").textContent = STRINGS[lang].toggle;
      }

      var current = detectLang();
      apply(current);
      document.getElementById("lang-toggle").addEventListener("click", function () {
        current = current === "es" ? "en" : "es";
        try { localStorage.setItem("lang", current); } catch (e) {}
        apply(current);
      });
    </script>
  </body>
</html>
